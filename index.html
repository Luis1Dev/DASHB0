<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acessar Cardápio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: linear-gradient(to bottom, #3b1f14, #1a0d08);
      color: white;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
    }
    .mesa-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: #c7741c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
    }
    .mesa-btn:hover {
      background: #a85f16;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍔 Cardápio Digital - Modo Teste</h1>
    <p>Selecione uma mesa para acessar:</p>
    
    <!-- Botões diretos -->
    <a href="entrada.html?mesa=1" class="mesa-btn">Mesa 1</a>
    <a href="entrada.html?mesa=2" class="mesa-btn">Mesa 2</a>
    <a href="entrada.html?mesa=3" class="mesa-btn">Mesa 3</a>
    
    <!-- Ou digitar qualquer mesa -->
    <div style="margin-top: 30px;">
      <h3>Ou digite qualquer número:</h3>
      <input type="number" id="mesaInput" placeholder="Número da mesa" min="1" value="1">
      <button onclick="acessarMesa()" class="mesa-btn">Acessar Cardápio</button>
    </div>
    
    <p style="margin-top: 30px; font-size: 14px; color: #ccc;">
      <strong>Modo de teste ativado</strong><br>
      QR Code desabilitado temporariamente
    </p>
  </div>

  <script>
    function acessarMesa() {
      const mesa = document.getElementById('mesaInput').value || '1';
      window.location.href = `entrada.html?mesa=${mesa}`;
    }
  </script>
</body>
</html>
